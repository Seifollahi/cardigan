name: tests

on:
  push:
  pull_request:

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scanner
        run: pip install zxing-cpp pillow

      - name: Run real phone pipeline (pkjs under node)
        run: NODE_PATH=test/shims node test/run_pkjs.js

      - name: Build host harness (colour)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter -DPBL_COLOR \
            -Itest/stub -Isrc/c \
            test/stub/pebble_stub.c test/harness.c src/c/storage.c src/c/comm.c \
            src/c/card_window.c src/c/menu_window.c -o test/out/harness

      - name: B&W compile check (aplite/diorite path)
        run: |
          gcc -fsyntax-only -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter \
            -Itest/stub -Isrc/c src/c/*.c

      - name: Logic + render (Pebble Time 2, 200x228)
        run: ./test/out/harness 200 228 test/out/emery_ --logic

      - name: Render (144x168)
        run: ./test/out/harness 144 168 test/out/basalt_

      - name: Scanner verification (zxing-cpp)
        run: python3 test/scan_check.py test/out/emery_ test/out/basalt_
