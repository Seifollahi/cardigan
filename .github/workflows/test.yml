name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runner image already ships node, python3 and gcc, which is everything
# this suite needs. Not calling setup-node/setup-python keeps the workflow
# off the Node-20 deprecation treadmill and removes two moving parts —
# Dependabot bumps the two actions that remain.
jobs:
  test:
    name: host suite (no SDK required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          node --version
          python3 --version
          gcc --version | head -1
          make --version | head -1

      - name: Install scanner dependencies
        run: |
          pip install -r requirements-dev.txt \
            || pip install --break-system-packages -r requirements-dev.txt

      # Unit tests (Code 128 round trip, QR packing), lint of every JS file
      # and all three C configurations, rendering of all four display
      # geometries through the real watchapp code, then zxing-cpp decodes
      # those frames — a barcode a scanner couldn't read fails the build.
      - name: make test
        run: make test

      # Rendered frames are the ground truth for any UI change: attaching
      # them lets a reviewer see exactly what a PR did to the screen.
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frames
          path: test/out/*.pgm
          retention-days: 14
          if-no-files-found: warn

  consistency:
    name: metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version, changelog and platform list agree
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          pkg = json.load(open("package.json"))
          version = pkg["version"]
          platforms = pkg["pebble"]["targetPlatforms"]
          problems = []

          if f"## {version}" not in open("CHANGELOG.md").read():
              problems.append(f"CHANGELOG.md has no section for version {version}")

          # every platform we ship must have a barcode budget on the phone
          pkjs = open("src/pkjs/index.js").read()
          budget = re.search(r"BARCODE_BUDGET = \{(.*?)\}", pkjs, re.S).group(1)
          for p in platforms:
              if p not in budget:
                  problems.append(f"{p} is in targetPlatforms but has no BARCODE_BUDGET entry")

          # the launcher icon must be declared and actually present
          media = pkg["pebble"]["resources"]["media"]
          if not any(m.get("menuIcon") for m in media):
              problems.append("no menuIcon declared in package.json resources")
          for m in media:
              path = os.path.join("resources", m["file"])
              if not os.path.exists(path):
                  problems.append(f"missing resource file {path}")

          if problems:
              print("\n".join("x " + p for p in problems))
              sys.exit(1)
          print(f"OK v{version}, {len(platforms)} platforms, resources present")
          PY

      - name: Documentation links resolve
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          broken = []
          for md in glob.glob("**/*.md", recursive=True):
              if "node_modules" in md:
                  continue
              base = os.path.dirname(md)
              text = open(md).read()
              links = [m.group(1) for m in re.finditer(r'\[[^\]]*\]\(([^)#\s]+)', text)]
              links += [m.group(1) for m in re.finditer(r'src="([^"]+)"', text)]
              for link in links:
                  # skip URLs and GitHub's repo-relative shortcuts (../../issues)
                  if link.startswith(("http://", "https://", "mailto:", "../../")):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, link))):
                      broken.append(f"{md} -> {link}")

          if broken:
              print("\n".join("broken: " + b for b in broken))
              sys.exit(1)
          print("all documentation links resolve")
          PY
