name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed to attach the .pbw to a release

jobs:
  pbw:
    name: build .pbw (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK's own tool asks "opt in to analytics? [y/n]" on first run.
      # There is no TTY in CI, so it would die with EOFError. Must exist
      # before any pebble command.
      - name: Silence the SDK analytics prompt
        run: |
          mkdir -p "$HOME/.pebble-sdk"
          touch "$HOME/.pebble-sdk/NO_TRACKING"

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # uv resolves pebble-tool's dependency tree properly; plain pip
      # leaves several transitive imports missing.
      - name: Install pebble-tool
        run: |
          uv tool install pebble-tool
          pebble --version

      - name: Cache the Pebble SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.pebble-sdk
          key: pebble-sdk-${{ runner.os }}-v1

      - name: Install the Pebble SDK
        run: |
          pebble sdk install latest || true
          pebble --version

      - name: Build
        run: pebble build

      - name: Verify every target platform is in the bundle
        run: |
          python3 - <<'PY'
          import glob, json, sys, zipfile
          pbw = glob.glob("build/*.pbw")
          if not pbw:
              sys.exit("no .pbw produced")
          want = set(json.load(open("package.json"))["pebble"]["targetPlatforms"])
          names = zipfile.ZipFile(pbw[0]).namelist()
          got = {n.split("/")[0] for n in names if n.endswith("/app.bin")}
          # the default platform lives at the archive root
          if "app.bin" in names:
              got.add("(root)")
          print("bundle:", pbw[0])
          print("platforms found:", ", ".join(sorted(got)) or "none")
          missing = want - got
          if missing:
              print("MISSING:", ", ".join(sorted(missing)))
              sys.exit(1)
          print("all", len(want), "target platforms present")
          PY

      - name: Upload .pbw artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardigan-pbw
          path: build/*.pbw
          retention-days: 90
          if-no-files-found: error

      # On a version tag, publish the binary straight to the release so
      # users have something to sideload without building anything.
      - name: Attach .pbw to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/*.pbw "cardigan-${VERSION}.pbw"
          gh release upload "$GITHUB_REF_NAME" "cardigan-${VERSION}.pbw" --clobber
